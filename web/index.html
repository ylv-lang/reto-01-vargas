<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agente de registro de proveedores</title><style>body{font:16px system-ui;background:#f4f6fa;margin:0;color:#172033}.wrap{max-width:900px;margin:30px auto;padding:20px}.card{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #17203312}h1{margin-top:0}.log{height:55vh;overflow:auto;border:1px solid #dbe1ea;border-radius:12px;padding:14px;margin:18px 0}.msg{padding:12px 14px;border-radius:12px;margin:10px 0;white-space:pre-wrap}.user{background:#e7efff;margin-left:12%}.assistant{background:#f0f2f6;margin-right:12%}.tools{font-size:13px;background:#fff6df;border:1px solid #f0d48a;border-radius:10px;padding:10px;margin:8px 0}.row{display:flex;gap:10px}input{flex:1;padding:14px;border:1px solid #ccd4e0;border-radius:10px;font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#254fc7;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.5}.hint{color:#667085;font-size:14px}</style></head><body><div class="wrap"><div class="card"><h1>Agente de registro de proveedores</h1><p class="hint">Prueba: “Procesa el caso ec-corp-andina. Dime faltantes y si está listo para firma. No envíes nada todavía.”</p><div id="log" class="log" aria-live="polite"></div><form id="form" class="row"><input id="message" placeholder="Escribe una instrucción…" autocomplete="off" required><button id="send">Enviar</button></form></div></div><script>const log=document.querySelector('#log'),form=document.querySelector('#form'),input=document.querySelector('#message'),button=document.querySelector('#send');let sessionId=localStorage.getItem('supplier-session')||crypto.randomUUID();localStorage.setItem('supplier-session',sessionId);function add(text,who='assistant'){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight;}form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';button.disabled=true;button.textContent='Pensando…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId,message})});const data=await r.json();for(const c of data.toolCalls||[]){const d=document.createElement('div');d.className='tools';d.textContent=`Herramienta: ${c.name}\nArgumentos: ${JSON.stringify(c.arguments)}\nResultado: ${JSON.stringify(c.result)}`;log.append(d);}add(data.reply||data.error);if(data.needsConfirmation){const d=document.createElement('div');d.className='tools';d.textContent='⚠️ Confirmación requerida antes de cualquier acción externa.';log.append(d);}log.scrollTop=log.scrollHeight;}catch(err){add('Error de conexión con el servidor.');}finally{button.disabled=false;button.textContent='Enviar';input.focus();}});add('Hola. Puedo procesar los casos de registro de proveedores disponibles en los fixtures.');</script></body></html>
